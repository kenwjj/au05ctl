[project]
name = "au05ctl"
version = "0.1.0"
description = "Program an Ulanzi AU05 Vibe Key's hotkeys from a JSON file, without Ulanzi Studio"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["hidapi>=0.14"]

[project.scripts]
au05 = "au05ctl:cli"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["au05.py", "au05ctl.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
